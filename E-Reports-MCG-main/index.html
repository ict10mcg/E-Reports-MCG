<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grades E-Reports</title>

<link rel="icon" type="image/x-icon" href="logo.png">

<style>

:root {
    --brand: #ffc900;
    --text-dark: #171717;
    --text-light: #ffffff;
    --button-bg: rgba(23, 23, 23, 0.85);
    --button-bg-hover: rgba(23, 23, 23, 0.92);
    --ring: rgba(255, 201, 0, 0.55);
}

/* RESET */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* HTML + BODY */
html,
body {
    height: 100%;
    font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Ubuntu,
        Cantarell,
        Noto Sans,
        Helvetica,
        Arial,
        sans-serif;

    color: var(--text-light);
}

/* BODY */
body {
    background: #000 url("G11/img/bg.png") center/cover no-repeat fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* MOBILE / TABLET BACKGROUND */
@media screen and (max-width: 1024px) {

    body {
        background:
            #000 url("G11/img/bg2.png")
            center/cover no-repeat scroll;
    }

}

/* DARK OVERLAY */
.backdrop {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.65)
        );

    pointer-events: none;
}

/* MAIN CONTAINER */
.container {
    width: 100%;
    text-align: center;

    /* This keeps everything perfectly centered */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    animation: fadeIn 1.2s ease forwards;
}

/* HEADER */
header {
    margin-bottom: 30px;
}

/* TITLE */
.title {
    font-size: clamp(1.4rem, 4vw, 2.4rem);

    text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.35);

    animation:
        slideDown 1s ease forwards;

    opacity: 0;
}

.title strong {
    color: var(--brand);
}

/* BUTTON GRID */
.grid {
    display: grid;

    grid-template-columns: 1fr;

    gap: 18px;

    width: min(600px, 92vw);

    margin: 0 auto;

    animation:
        fadeUp 1s ease forwards;

    opacity: 0;
}

/* DESKTOP */
@media (min-width: 600px) {

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

/* CARD */
.card {
    position: relative;

    display: block;

    text-decoration: none;

    color: var(--text-light);

    background:
        var(--button-bg);

    border:
        1px solid rgba(255, 255, 255, 0.06);

    border-radius: 18px;

    padding: 22px 18px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);

    backdrop-filter: blur(6px);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;

    transform:
        translateY(20px);

    opacity: 0;

    animation:
        cardFadeIn 0.8s forwards;
}

/* CARD ANIMATION DELAYS */
.card:nth-child(1) {
    animation-delay: 0.2s;
}

.card:nth-child(2) {
    animation-delay: 0.4s;
}

/* CARD HOVER */
.card:hover,
.card:focus-visible {

    transform:
        translateY(-4px)
        scale(1.03);

    box-shadow:
        0 16px 44px rgba(0, 0, 0, 0.45);

    background:
        var(--button-bg-hover);

    border-color:
        var(--ring);

    outline: none;
}

/* LABEL */
.label {

    display: inline-flex;

    align-items: center;

    gap: 10px;

    font-weight: 800;

    font-size:
        clamp(1rem, 2.5vw, 1.4rem);
}

/* BADGE */
.badge {

    display: inline-grid;

    place-items: center;

    width: 38px;
    height: 38px;

    border-radius: 10px;

    background:
        var(--brand);

    color:
        var(--text-dark);

    font-weight: 900;

    box-shadow:
        inset 0 -2px 0 rgba(0, 0, 0, 0.12),
        0 6px 16px rgba(255, 201, 0, 0.36);
}

/* ARROW */
.arrow {

    position: absolute;

    right: 16px;
    bottom: 12px;

    font-size: 1.2rem;

    opacity: 0.9;

    transition:
        transform 0.3s ease;
}

/* ARROW HOVER */
.card:hover .arrow {

    transform:
        translateX(5px);
}

/* FOOTER */
footer {

    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;

    text-align: center;

    background:
        rgba(255, 255, 255, 0.1);

    backdrop-filter:
        blur(20px);

    color: #fff;

    padding: 10px;

    font-family: sans-serif;

    z-index: 10;
}

footer p {
    margin: 0;
}

/* ANIMATIONS */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes slideDown {

    from {
        opacity: 0;
        transform:
            translateY(-30px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform:
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}

@keyframes cardFadeIn {

    from {
        opacity: 0;
        transform:
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}

</style>
</head>


<body>

<!-- BACKGROUND OVERLAY -->
<div
    class="backdrop"
    aria-hidden="true">
</div>


<!-- MAIN CONTENT -->
<div class="container">

    <header>

        <h1 class="title">
            <strong>Grades</strong> E-Reports
        </h1>

    </header>


    <main>

        <div
            class="grid"
            role="list">

            <!-- 2025 -->
            <a
                class="card"
                role="listitem"
                href="2025.html">

                <span class="label">

                    <span class="badge">
                        25
                    </span>

                    2025

                </span>

                <span class="arrow">
                    →
                </span>

            </a>


            <!-- 2026 -->
            <a
                class="card"
                role="listitem"
                href="2026.html">

                <span class="label">

                    <span class="badge">
                        26
                    </span>

                    2026

                </span>

                <span class="arrow">
                    →
                </span>

            </a>

        </div>

    </main>

</div>


<!-- FOOTER -->
<footer>

    <p>
        Design By - MCG DBMS 2025 ©
    </p>

</footer>

</body>
</html>
